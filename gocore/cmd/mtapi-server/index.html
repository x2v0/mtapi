<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/jpeg" href="/me.jpg">
<title>mtapi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<header>
      <div class="head-right">
        <button class="icon-btn" id="theme" title="🌙 Light / Dark theme (localStorage: mtapi-theme)" aria-label="toggle theme">&#127769;</button>
        </div>
        </header>
<div class="stats">
      <div class="stat" id="st-batt" >battery &mdash;</div>
      <div class="stat" id="st-ram" >ram &mdash;</div>
    </div>
<input class="search" id="q" placeholder="filter endpoints… (battery, sensors, net)" title="🔍 Filter endpoints by path (live, case-insensitive)" aria-label="filter endpoints">
<main id="main"></main>
</div>

<script>var TOKEN="{{TOKEN}}";</script>
<script src="/app.js"></script>
<script src="/mtapi-debug.js"></script>
<script>
if (window.MtapiDebug) {
  try { MtapiDebug.attach(); } catch (e) { console.error('MtapiDebug.attach failed:', e); }
}
</script>

  <div id="logcat-pre" style="display:none"></div>
  <input id="logcat-live" type="checkbox" style="display:none">
  <div id="devtools-frame" style="display:none"></div>
</body>
</html>
