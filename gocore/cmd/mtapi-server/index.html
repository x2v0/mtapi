<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/jpeg" href="/me.jpg">
<title>mtapi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<header>
      <button class="icon-btn" id="theme" title="Theme" aria-label="toggle theme" style="position:absolute;left:50%;transform:translateX(-50%);width:16px;height:16px;font-size:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">&#127769;</button>
      <button class="icon-btn" id="help-btn" title="Help mode (?)" aria-label="help mode" onclick="window._helpModeToggle&&window._helpModeToggle()" style="position:absolute;left:calc(50% + 22px);width:16px;height:16px;font-size:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold">?</button>
      <button id="browser-btn" class="icon-btn" title="Browser" style="width:16px;height:16px;font-size:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">🌐</button>
      <div class="head-right">
        </div>
        </header>
<div class="stats">
      <div class="stat" id="st-batt" >battery &mdash;</div>
      <div class="stat" id="st-ram" >ram &mdash;</div>
    </div>
<input class="search" id="q" placeholder="filter endpoints… (battery, sensors, net)" title="🔍 Filter endpoints by path (live, case-insensitive)" aria-label="filter endpoints">
<main id="main"></main>
</div>

<script>var TOKEN="{{TOKEN}}";</script>
<script src="/app.js"></script>
<script src="/mtapi-debug.js"></script>
<script>
if (window.MtapiDebug) {
  try { MtapiDebug.attach(); } catch (e) { console.error('MtapiDebug.attach failed:', e); }
}
</script>

  <div id="logcat-pre" style="display:none"></div>
  <input id="logcat-live" type="checkbox" style="display:none">
  <div id="devtools-frame" style="display:none"></div>
</body>
</html>
