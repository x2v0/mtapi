<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mtapi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.4;background:#1e1e1e;color:#ddd;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0;color:#fff}
.head-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:0}
.token{background:#2a2a2a;padding:4px 8px;border-radius:4px;font-size:11px;word-break:break-all;user-select:all;-webkit-user-select:all;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{background:#2a2a2a;color:#4fc3f7;border:1px solid #444;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap}
.copy:hover{background:#333}
.search{width:100%;padding:8px 10px;background:#252525;border:1px solid #333;border-radius:6px;color:#ddd;font-family:inherit;font-size:13px;margin-bottom:12px}
.search:focus{outline:none;border-color:#4fc3f7}
.group{margin-bottom:16px}
.group-h{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 0;font-weight:600}
.ep{background:#252525;border-radius:6px;margin-bottom:6px;overflow:hidden;border:1px solid #2a2a2a}
.ep-h{display:flex;align-items:center;gap:6px;padding:8px 10px}
.ep-h .run{flex:1;text-align:left;background:none;border:none;color:#4fc3f7;padding:0;cursor:pointer;font-family:inherit;font-size:13px;word-break:break-all}
.ep-h .run:hover{text-decoration:underline}
.ep-h .status{font-size:11px;color:#888;min-width:44px;text-align:right;white-space:nowrap}
.ep-h .status.ok{color:#6ad86a}
.ep-h .status.err{color:#f77}
.ep-h .status.loading{color:#fc3}
.ep-h .toggle{background:#2a2a2a;border:none;color:#aaa;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px;font-family:inherit;display:none}
.ep-h .toggle:hover{background:#333;color:#ddd}
.ep-b{padding:0 10px 10px 10px;overflow-x:auto}
.ep-b[hidden]{display:none}
.ep-b .raw{margin-top:8px;border-top:1px solid #333;padding-top:8px}
.ep-b .raw summary{cursor:pointer;color:#888;font-size:11px;user-select:none}
.ep-b .raw pre{background:#1e1e1e;padding:8px;border-radius:4px;overflow-x:auto;font-size:11px;margin:6px 0 0 0;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12px;margin:0}
th,td{padding:5px 8px;border-bottom:1px solid #2a2a2a;text-align:left;vertical-align:top;word-break:break-word}
th{background:#2a2a2a;color:#aaa;font-weight:600;font-size:11px}
tr:hover td{background:#2a2a2a}
.empty{color:#666;font-style:italic;padding:6px 0;font-size:11px}
.scalar{padding:6px 0;word-break:break-all}
code{background:#2a2a2a;padding:1px 4px;border-radius:3px;color:#ce9178;font-size:11px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #444;border-top-color:#fc3;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>mtapi</h1>
<div class="head-right">
<div class="token" id="tok">{{TOKEN}}</div>
<button class="copy" id="copy">copy</button>
</div>
</header>
<input class="search" id="q" placeholder="filter endpoints… (e.g. battery, sensors, net)">
<main id="main"></main>
</div>
<script>
const TOKEN = "{{TOKEN}}";

const ENDPOINTS = [
  { group: "Basic", eps: [
    "/ping", "/battery", "/wifi", "/device", "/location",
    "/clipboard", "/clipboard?op=set&text=hello",
    "/toast?text=hello", "/notify?title=Hi&body=There",
    "/vibrate?ms=200", "/torch?on=1", "/torch?on=0",
    "/torch/brightness?level=50", "/torch/brightness?level=0",
    "/tts?text=hello", "/share?title=Hi&text=There"
  ]},
  { group: "Contacts / SMS", eps: [
    "/contacts?limit=5", "/calllog?limit=5", "/sms?limit=5"
  ]},
  { group: "System", eps: [
    "/system", "/cpu/detail", "/thermal", "/memory", "/storage", "/kernel"
  ]},
  { group: "Network", eps: [
    "/network", "/wifi/detailed", "/bluetooth", "/telephony",
    "/wifi/scan", "/net/ping?host=8.8.8.8&count=3",
    "/net/dns?host=example.com",
    "/net/fetch?url=https%3A%2F%2Fapi.ipify.org%3Fformat%3Djson"
  ]},
  { group: "Display / Audio", eps: [
    "/display", "/display/brightness", "/display/color",
    "/audio", "/microphone", "/audio/volume?stream=2", "/audio/ringer"
  ]},
  { group: "Sensors", eps: [
    "/sensors", "/sensors/read?name=accelerometer&ms=500",
    "/sensors/stream?name=accelerometer&hz=10",
    "/sensors/stream/stop?name=accelerometer"
  ]},
  { group: "Hardware", eps: [
    "/features", "/camera/list", "/camera/snapshot",
    "/microphone/record?seconds=3"
  ]},
  { group: "Apps", eps: [
    "/app/list", "/app/launch?pkg=com.android.settings"
  ]},
  { group: "Detailed", eps: [
    "/battery/detailed", "/location/detailed", "/locale",
    "/calendar?days=7", "/alarm/next"
  ]},
  { group: "Files / Audio play", eps: [
    "/files/save?name=test.txt&data=hello",
    "/audio/play?uri=/system/media/audio/notifications/Hello.ogg",
    "/audio/play/stop", "/tts/voices", "/tts/stop"
  ]},
  { group: "Watch (poll → logcat)", eps: [
    "/clipboard/watch?hz=2", "/clipboard/watch/stop",
    "/location/watch?hz=1", "/location/watch/stop"
  ]}
];

const SLOW = new Set([
  "/camera/snapshot",
  "/microphone/record?seconds=3",
  "/sensors/read?name=accelerometer&ms=500"
]);

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function cellStr(v){
  if (v === null) return 'null';
  if (v === undefined) return '';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function renderData(data){
  if (data === null || data === undefined) return '<div class="empty">null</div>';
  if (Array.isArray(data)){
    if (data.length === 0) return '<div class="empty">(empty array)</div>';
    if (typeof data[0] !== 'object' || data[0] === null){
      var h0 = '<table><tbody>';
      for (var i=0; i<data.length; i++) h0 += '<tr><td>' + esc(cellStr(data[i])) + '</td></tr>';
      return h0 + '</tbody></table>';
    }
    var cols = [];
    var seen = {};
    for (var ri=0; ri<data.length; ri++){
      var row = data[ri];
      if (row && typeof row === 'object'){
        for (var k in row){
          if (Object.prototype.hasOwnProperty.call(row, k) && !seen[k]){
            seen[k] = true; cols.push(k);
          }
        }
      }
    }
    var h = '<table><thead><tr>';
    for (var ci=0; ci<cols.length; ci++) h += '<th>' + esc(cols[ci]) + '</th>';
    h += '</tr></thead><tbody>';
    for (var rj=0; rj<data.length; rj++){
      h += '<tr>';
      for (var cj=0; cj<cols.length; cj++){
        h += '<td>' + esc(cellStr(data[rj] ? data[rj][cols[cj]] : null)) + '</td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  if (typeof data === 'object'){
    var hk = '<table><tbody>';
    for (var kk in data){
      if (Object.prototype.hasOwnProperty.call(data, kk)){
        hk += '<tr><th>' + esc(kk) + '</th><td>' + esc(cellStr(data[kk])) + '</td></tr>';
      }
    }
    return hk + '</tbody></table>';
  }
  return '<div class="scalar">' + esc(String(data)) + '</div>';
}

function call(path){
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  var url = path + sep + 'token=' + encodeURIComponent(TOKEN);
  var t0 = performance.now();
  var ctl = new AbortController();
  var timeoutMs = SLOW.has(path) ? 40000 : 12000;
  var timer = setTimeout(function(){ ctl.abort(); }, timeoutMs);
  return fetch(url, { signal: ctl.signal })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(timer);
      return { ms: Math.round(performance.now() - t0), json: j };
    })
    .catch(function(e){
      clearTimeout(timer);
      return { ms: Math.round(performance.now() - t0), error: String(e) };
    });
}

function makeCard(path){
  var ep = document.createElement('div');
  ep.className = 'ep';
  ep.dataset.path = path;

  var head = document.createElement('div');
  head.className = 'ep-h';

  var btn = document.createElement('button');
  btn.className = 'run';
  btn.textContent = 'GET ' + path;
  btn.addEventListener('click', function(){ run(ep, path); });

  var status = document.createElement('span');
  status.className = 'status';

  var toggle = document.createElement('button');
  toggle.className = 'toggle';
  toggle.textContent = '{ }';
  toggle.title = 'toggle raw JSON';

  head.appendChild(btn);
  head.appendChild(status);
  head.appendChild(toggle);

  var body = document.createElement('div');
  body.className = 'ep-b';
  body.hidden = true;

  ep.appendChild(head);
  ep.appendChild(body);
  return ep;
}

function run(ep, path){
  var status = ep.querySelector('.status');
  var body = ep.querySelector('.ep-b');
  var toggle = ep.querySelector('.toggle');

  body.hidden = false;
  status.className = 'status loading';
  status.innerHTML = '<span class="spin"></span>';
  body.innerHTML = '<div class="empty">loading…</div>';

  call(path).then(function(res){
    if (res.error){
      status.className = 'status err';
      status.textContent = res.ms + 'ms';
      body.innerHTML = '<div class="empty" style="color:#f77">' + esc(res.error) + '</div>';
      toggle.style.display = 'none';
      return;
    }
    var j = res.json;
    if (j && j.ok === false){
      status.className = 'status err';
      status.textContent = res.ms + 'ms';
      body.innerHTML = '<div class="empty" style="color:#f77">error: ' + esc(j.error || 'unknown') + '</div>';
      toggle.style.display = 'none';
      return;
    }
    status.className = 'status ok';
    status.textContent = res.ms + 'ms';

    var data = (j && ('data' in j)) ? j.data : j;
    body.innerHTML = renderData(data);

    var raw = document.createElement('details');
    raw.className = 'raw';
    var sum = document.createElement('summary');
    sum.textContent = 'raw JSON';
    var pre = document.createElement('pre');
    pre.textContent = JSON.stringify(j, null, 2);
    raw.appendChild(sum);
    raw.appendChild(pre);
    body.appendChild(raw);

    toggle.style.display = '';
    toggle.onclick = function(){
      raw.open = !raw.open;
      if (raw.open) raw.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
  });
}

function render(){
  var q = document.getElementById('q').value.toLowerCase();
  var main = document.getElementById('main');
  main.innerHTML = '';
  for (var gi=0; gi<ENDPOINTS.length; gi++){
    var g = ENDPOINTS[gi];
    var filtered = g.eps.filter(function(p){ return p.toLowerCase().indexOf(q) >= 0; });
    if (filtered.length === 0) continue;
    var gd = document.createElement('div');
    gd.className = 'group';
    var h = document.createElement('div');
    h.className = 'group-h';
    h.textContent = g.group;
    gd.appendChild(h);
    for (var pi=0; pi<filtered.length; pi++){
      gd.appendChild(makeCard(filtered[pi]));
    }
    main.appendChild(gd);
  }
}

document.getElementById('copy').addEventListener('click', function(){
  navigator.clipboard.writeText(TOKEN).then(function(){
    var b = document.getElementById('copy');
    b.textContent = 'copied';
    setTimeout(function(){ b.textContent = 'copy'; }, 1500);
  }).catch(function(){});
});

document.getElementById('q').addEventListener('input', render);

render();

setTimeout(function(){
  var first = document.querySelector('.ep[data-path="/ping"] .run');
  if (first) first.click();
}, 150);
</script>
</body>
</html>
